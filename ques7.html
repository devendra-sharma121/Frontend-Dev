<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typography Demo</title>
<style>
body {
  font-family: 'Georgia', serif;
  line-height: 1.6;
  margin: 40px;
  letter-spacing: 0.5px;
}
h1 {
  text-align: center;
  text-transform: uppercase;
}
article::first-letter { font-size: 2em; color: #007bff; font-weight: bold; }
article::first-line { font-weight: bold; }
mark { background: #ffeb3b; color: black; }
strong { color: #ff5733; }
em { color: #6f42c1; font-style: italic; }
</style>
</head>
<body>
  <h1>Typography Example</h1>
  <article>
    <p><mark>Typography</mark> is the art of arranging text to make written language clear and appealing.
    Using <strong>font-weight</strong> and <em>emphasis</em> can greatly improve readability.</p>
  </article>
</body>
</html>
