<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security Example</title>
</head>
<body>
    <h1>Secure Form Example</h1>

    <form autocomplete="off">
        <label>Username:</label>
        <input type="text" name="username" required><br><br>

        <label>Password:</label>
        <input type="password" name="password" required><br><br>

        <input type="submit" value="Login">
    </form>

    <p><strong>Note:</strong> Turning off autocomplete prevents browsers from saving sensitive information like usernames and passwords, improving security on shared devices.</p>
</body>
</html>
