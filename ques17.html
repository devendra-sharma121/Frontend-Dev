<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form with Iframe</title>
</head>
<body>
    <h1>Form Submission Example</h1>

    <form action="result.html" target="resultFrame">
        <label>Enter your name:</label>
        <input type="text" name="username" required>
        <input type="submit" value="Submit">
    </form>

    <iframe name="resultFrame" width="80%" height="200" title="Result Frame"></iframe>
</body>
</html>
