<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Height and Width Practice</title>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  gap: 20px;
  background: #eee;
}
.box {
  text-align: center;
  color: white;
  overflow: auto;
}
.box1 { width: 150px; height: 100px; background: #ff5733; }
.box2 { width: 20%; height: 20vh; background: #28a745; min-height: 100px; }
.box3 { width: 10em; height: 8em; background: #007bff; max-width: 200px; }
</style>
</head>
<body>
  <div class="box box1">px</div>
  <div class="box box2">%, vh</div>
  <div class="box box3">em</div>
</body>
</html>
