<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip Demo</title>
<link rel="stylesheet" href="tooltip.css">
</head>
<body>
<h1>CSS Tooltip Demonstration</h1>
<div class="tooltip-container">
  <div class="tooltip">Hover me
    <span class="tooltip-text">I am a tooltip!</span>
  </div>
  <div class="tooltip">Info Icon ℹ️
    <span class="tooltip-text">Helpful information here</span>
  </div>
  <div class="tooltip">CSS Rocks 💫
    <span class="tooltip-text">Yes, it does!</span>
  </div>
</div>
</body>
</html>
