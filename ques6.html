<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animations Demo</title>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  gap: 40px;
}
.box, .circle, .text { width: 60px; height: 60px; }
.box {
  background: #ff5733;
  animation: move 3s infinite ease-in-out;
}
.circle {
  background: #28a745;
  border-radius: 50%;
  animation: bounce 2s infinite ease-in-out;
}
.text {
  width: auto;
  color: #007bff;
  animation: colorChange 4s infinite alternate;
}
@keyframes move { 0% {transform: translateX(0);} 50% {transform: translateX(80px);} 100% {transform: translateX(0);} }
@keyframes bounce { 0%,100% {transform: translateY(0);} 50% {transform: translateY(-50px);} }
@keyframes colorChange { 0% {color:#007bff;} 50% {color:#ff5733;} 100% {color:#28a745;} }
</style>
</head>
<body>
  <div class="box"></div>
  <div class="circle"></div>
  <div class="text">Animated Text</div>
</body>
</html>
