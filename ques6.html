<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Transformations</title>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  height: 100vh;
}
.box {
  width: 100px; height: 100px;
  background: #007bff;
  text-align: center;
  color: white;
  transition: all 0.4s ease;
}
.rotate:hover { transform: rotate(45deg); background: #ff5733; }
.scale:hover { transform: scale(1.3); background: #28a745; }
.translate:hover { transform: translate(20px, -20px); background: #ffc107; }
.skew:hover { transform: skew(20deg, 10deg); background: #6f42c1; }
</style>
</head>
<body>
  <div class="box rotate">Rotate</div>
  <div class="box scale">Scale</div>
  <div class="box translate">Translate</div>
  <div class="box skew">Skew</div>
</body>
</html>
