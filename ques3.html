<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Backgrounds</title>
<style>
body, html { margin: 0; padding: 0; }
header, footer {
  position: fixed;
  width: 100%;
  text-align: center;
  padding: 15px;
  color: white;
  background: #222;
}
header { top: 0; }
footer { bottom: 0; }
main { margin-top: 60px; margin-bottom: 60px; }
.section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 24px;
}
.linear {
  background: linear-gradient(to right, #ff7e5f, #feb47b);
}
.radial {
  background: radial-gradient(circle, #4facfe, #00f2fe);
  background-attachment: fixed;
}
</style>
</head>
<body>
  <header>Fixed Header</header>
  <main>
    <section class="section linear">Linear Gradient Section</section>
    <section class="section radial">Radial Gradient Section</section>
  </main>
  <footer>Fixed Footer</footer>
</body>
</html>
