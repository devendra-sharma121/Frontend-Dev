<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Selectors Practice</title>
<style>
/* Element selector */
p { color: #333; }

/* Class selector */
.highlight { background: #ffeeba; }

/* ID selector */
#special { color: #007bff; font-weight: bold; }

/* Attribute selector */
a[target="_blank"] { color: green; }

/* Combinators */
div > p { color: purple; }      /* Direct child */
h2 + p { font-style: italic; }  /* Next sibling */
ul li { color: #555; }          /* Descendant */
</style>
</head>
<body>
  <header><h1>CSS Selectors Practice</h1></header>
  <div>
    <p>This is a paragraph inside a div.</p>
    <p class="highlight">This one uses a class selector.</p>
    <p id="special">This one uses an ID selector.</p>
  </div>
  <a href="#" target="_blank">External Link</a>
  <h2>List Example</h2>
  <p>This paragraph uses + combinator style.</p>
  <ul><li>Item 1</li><li>Item 2</li><li>Item 3</li></ul>
  <footer><p>Footer text here</p></footer>
</body>
</html>
