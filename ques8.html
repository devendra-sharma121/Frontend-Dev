<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box-Sizing Comparison</title>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  height: 100vh;
  flex-wrap: wrap;
}
.box {
  width: 200px;
  padding: 20px;
  border: 5px solid #007bff;
  color: white;
  text-align: center;
}
.content-box { background: #ff5733; box-sizing: content-box; }
.border-box { background: #28a745; box-sizing: border-box; }
</style>
</head>
<body>
  <div class="box content-box">Content-box (default)</div>
  <div class="box border-box">Border-box</div>
</body>
</html>
