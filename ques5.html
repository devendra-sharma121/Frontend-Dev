<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced CSS Selectors</title>
<style>
/* Attribute selector */
input[type="text"] { border: 2px solid blue; }
/* Starts-with selector */
a[href^="https"] { color: green; }
/* Pseudo-class */
li:hover { color: red; }
/* Pseudo-element */
li::before { content: "👉 "; }
/* nth-child selector */
li:nth-child(2) { font-weight: bold; }
/* Combinators */
div > p { color: purple; } /* direct child */
p + span { color: orange; } /* adjacent sibling */
p ~ b { color: teal; } /* general sibling */
</style>
</head>
<body>
  <input type="text" placeholder="Type here">
  <a href="https://example.com">Secure Link</a>
  <ul>
    <li>Apple</li>
    <li>Banana</li>
    <li>Cherry</li>
  </ul>
  <div>
    <p>Paragraph inside div</p>
    <span>Next to paragraph</span>
    <b>Bold text sibling</b>
  </div>
</body>
</html>
