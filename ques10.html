<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini UI Layout</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f3f6;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
header, footer {
  background: #007bff;
  color: white;
  text-align: center;
  padding: 15px;
}
main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}
.card img {
  width: 100px; border-radius: 50%;
}
.card input, .card button {
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}
.card button {
  background: #007bff; color: white; border: none;
  transition: 0.3s;
}
.card button:hover { background: #0056b3; }
.card input:focus { border-color: #007bff; outline: none; }
</style>
</head>
<body>
  <header>Mini User Interface</header>
  <main>
    <div class="card">
      <img src="https://picsum.photos/100" alt="User">
      <input type="text" placeholder="Enter your name">
      <button>Submit</button>
    </div>
  </main>
  <footer>© 2025 UI Demo</footer>
</body>
</html>
