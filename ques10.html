<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dropdown Selection</title>
</head>
<body>
  <h1>Choose Your Location</h1>


  <label for="country">Country:</label><br>
  <select id="country" name="country">
    <option value="india" selected>India</option>
    <option value="usa">United States</option>
    <option value="japan">Japan</option>
  </select>
  <br><br>

  
  <label for="state">State:</label><br>
  <select id="state" name="state">
    <option value="delhi" selected>Delhi</option>
    <option value="maharashtra">Maharashtra</option>
    <option value="karnataka">Karnataka</option>
  </select>
  <br><br>

  
  <label for="city">City:</label><br>
  <select id="city" name="city">
    <option value="newdelhi" selected>New Delhi</option>
    <option value="mumbai">Mumbai</option>
    <option value="bangalore">Bangalore</option>
  </select>
  <br><br>

  
  <label for="place">Favorite Tourist Place:</label><br>
  <select id="place" name="place">
    <option value="qutub" selected>Qutub Minar</option>
    <option value="taj">Taj Mahal</option>
    <option value="gateway">Gateway of India</option>
  </select>
  <br><br>

  <p>Selected: Country - India; State - Delhi; City - New Delhi; Favorite Place - Qutub Minar.</p>
</body>
</html>
