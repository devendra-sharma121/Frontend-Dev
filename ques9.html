<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Effects</title>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  height: 100vh;
}
.btn {
  padding: 15px 25px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 8px;
  transition: all 0.3s ease;
  box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  cursor: pointer;
}
.btn:hover {
  transform: scale(1.1);
  background: #0056b3;
  box-shadow: 0 8px 15px rgba(0,0,0,0.3);
}
</style>
</head>
<body>
  <button class="btn">Hover Me</button>
  <button class="btn">Try Me</button>
  <button class="btn">Click Me</button>
</body>
</html>
