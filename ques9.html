<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload</title>
</head>
<body>
    <h1>Upload an Image</h1>
    <form>
        <input type="file" name="image" accept=".jpg, .png" required><br><br>
        <input type="submit" value="Upload">
    </form>
    <p>Note: Only .jpg and .png files are allowed.</p>
</body>
</html>
