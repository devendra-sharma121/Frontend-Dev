<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borders and Padding Demo</title>
<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  min-height: 100vh;
  background: #f4f4f4;
}
.box {
  width: 150px;
  height: 100px;
  padding: 20px;
  text-align: center;
  transition: border-color 0.4s;
}
.solid { border: 4px solid #007bff; }
.dashed { border: 4px dashed #28a745; }
.double { border: 6px double #ff5733; }
.groove { border: 6px groove #6f42c1; }
.rounded { border-radius: 15px; }
.box:hover { border-color: black; }
</style>
</head>
<body>
  <div class="box solid rounded">Solid</div>
  <div class="box dashed rounded">Dashed</div>
  <div class="box double rounded">Double</div>
  <div class="box groove rounded">Groove</div>
</body>
</html>
