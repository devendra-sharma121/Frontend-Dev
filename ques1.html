<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pseudo Classes Demo</title>
<link rel="stylesheet" href="pseudo-classes.css">
</head>
<body>
<h1>Pseudo-Class Demonstration</h1>
<div class="container">
  <div class="example">
    <a href="#">Hover over this link</a>
    <p>:hover changes background and color.</p>
  </div>
  <div class="example">
    <input type="text" placeholder="Click here">
    <p>:focus adds border glow.</p>
  </div>
  <div class="example">
    <button>Click Me</button>
    <p>:active darkens the button when pressed.</p>
  </div>
  <div class="example list-example">
    <ul>
      <li>First</li>
      <li>Second</li>
      <li>Third</li>
      <li>Fourth</li>
    </ul>
    <p>:nth-child(odd) highlights alternate items.</p>
  </div>
</div>
</body>
</html>
